# Temporary, reversible Compose override for InsiEDR backend health mitigation
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
# Rollback:
#   Remove this file and run `docker compose up -d`

services:
  db:
    healthcheck:
      # Extend start_period to 600s to allow PostgreSQL crash recovery (WAL replay)
      # to finish cleanly on mechanical HDD without Docker prematurely failing the container
      start_period: 600s
      retries: 10

  backend:
    healthcheck:
      # Extend probe-internal timeout from 8s to 20s to prevent false-alarm exits
      # Readiness stays separate from the lightweight /api/health/live endpoint.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health/ready', timeout=20)"]
      interval: 60s
      timeout: 25s
      retries: 5
      start_period: 0s
    environment:
      # Fail interactive analytics promptly; retain timestamped snapshots on failure.
      INSIEDR_CLICKHOUSE_QUERY_TIMEOUT: "12"
      # Enable only after prepare_dashboard_rollups.py has completed and been verified.
      INSIEDR_CH_ROLLUPS_ENABLED: ${INSIEDR_CH_ROLLUPS_ENABLED:-false}
