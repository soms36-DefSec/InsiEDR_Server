# Opt-in 16 GB host profile. Read docs/RAM_FIRST_SERVER_ARCHITECTURE.md first.
# Explicit -f arguments avoid accidentally applying development override files.
services:
  db:
    mem_limit: 2048m
    memswap_limit: 2048m
  redis:
    mem_limit: 2304m
    memswap_limit: 2304m
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 2304m, pids: 128}
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD}',
              '--save', '', '--appendonly', 'no', '--maxmemory', '1536mb',
              '--maxmemory-policy', 'allkeys-lru', '--loglevel', 'warning']
  clickhouse:
    mem_limit: 4608m
    memswap_limit: 4608m
    deploy:
      resources:
        limits: {cpus: '4.0', memory: 4608m, pids: 512}
    volumes:
      - ./server/storage/clickhouse_ram_config.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
  backend:
    cpus: 4.0
    mem_limit: 2560m
    memswap_limit: 2560m
    deploy:
      resources:
        limits: {cpus: '4.0', memory: 2560m, pids: 256}
    command: ['uvicorn', 'server.app:app', '--host', '0.0.0.0', '--port', '5000',
              '--workers', '1', '--timeout-graceful-shutdown', '60']
    environment:
      INSIEDR_RAM_TELEMETRY_ENABLED: 'true'
      INSIEDR_V3_CUTOVER_READY: '${INSIEDR_V3_CUTOVER_READY:-false}'
      INSIEDR_JOURNAL_KEY: '${INSIEDR_JOURNAL_KEY:?Set a persistent base64 32-byte journal key}'
      INSIEDR_JOURNAL_DIR: /app/data/ingest-journal
      INSIEDR_JOURNAL_MAX_BYTES: '21474836480'
      INSIEDR_DISK_RESERVE_BYTES: '53687091200'
      INSIEDR_TELEMETRY_ACTIVE_DAYS: '${INSIEDR_TELEMETRY_ACTIVE_DAYS:-30}'
      INSIEDR_TELEMETRY_TOTAL_RETENTION_DAYS: '${INSIEDR_TELEMETRY_TOTAL_RETENTION_DAYS:-90}'
    volumes:
      - journal_v3:/app/data/ingest-journal
  nginx:
    cpus: 1.0
    mem_limit: 256m
    memswap_limit: 256m
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 256m, pids: 128}
volumes:
  journal_v3:
