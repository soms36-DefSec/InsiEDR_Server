# A uniquely named gateway prevents the two projects' "backend" service DNS
# aliases from colliding on the main Nginx edge network.
services:
  presentation-gateway:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./nginx/scenario-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [scenario, presentation_edge]

networks:
  presentation_edge:
    external: true
    name: insiedr_server_edge
