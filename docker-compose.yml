services:
  db:
    image: postgres:16-alpine
    restart: always
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insiedr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insiedr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-insiedr_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insiedr} -d ${POSTGRES_DB:-insiedr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:-insiedr_redis_pass}",
      "--save", "60", "1",
      "--appendonly", "yes",
      "--loglevel", "warning",
      "--maxmemory", "1gb",
      "--maxmemory-policy", "noeviction"
    ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-insiedr_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-insiedr_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-insiedr_ch_pass}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./server/storage/clickhouse_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_DSN=postgresql://${POSTGRES_USER:-insiedr}:${POSTGRES_PASSWORD:-insiedr_pass}@db:5432/${POSTGRES_DB:-insiedr_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-insiedr_redis_pass}@redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-insiedr_ch_pass}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-insiedr_analytics}
      - INSIEDR_DLQ_ENABLED=true
      - INSIEDR_DLQ_DIR=/app/data/dlq
      - CLICKHOUSE_QUERY_TIMEOUT=30
      - CLICKHOUSE_MAX_MEMORY=2000000000
      - PYTHONPATH=/app
      - SYSTEM_DEFAULT_PROFILE=${SYSTEM_DEFAULT_PROFILE:-DEFAULT}
      - ENABLE_CORROBORATION_GUARD=true
    volumes:
      - ./data/dlq:/app/data/dlq

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
